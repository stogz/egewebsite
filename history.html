<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="EGE_Logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History · EGE NBA Simulation</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <script src="sim-config.js"></script>
  <link rel="stylesheet" href="css/history.css" />
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div class="grid-overlay"></div>
  <div class="scanline"></div>

  <nav>
    <a href="index.html" class="nav-logo">
      <img src="EGE_Logo.png" alt="EGE Logo" class="logo-img" />
      <span>EGE <span class="accent">NBA</span> Simulation</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html"   data-num="01">Home</a></li>
      <li><a href="players.html" data-num="02">Players</a></li>
      <li><a href="teams.html"   data-num="03">Teams</a></li>
      <li><a href="history.html" data-num="04" class="active">History</a></li>
      <li><a href="other.html"   data-num="05">Other</a></li>
      <li id="sim-toggle-li"></li>
      <li><button id="mode-toggle" title="Toggle light/dark mode">☀</button></li>
    </ul>
  </nav>

  <div class="history-page">

    <div class="history-controls">
      <div class="history-controls-left">
        <div class="history-select-wrap">
          <select class="history-select" id="history-category">
            <option value="mvp">Most Valuable Player</option>
            <option value="roty">Rookie of the Year</option>
            <option value="dpoy">Defensive Player of the Year</option>
            <option value="sixmoty">Sixth Man of the Year</option>
            <option value="mip">Most Improved Player</option>
            <option value="champion">Finals MVP</option>
          </select>
          <svg class="history-select-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 10l5 5 5-5"/></svg>
        </div>
      </div>
      <div class="history-controls-right">
        <!-- View toggle: grid (4 squares) | list (3 lines) -->
        <div class="history-view-toggle">
          <button class="history-view-btn active" id="view-card" title="Card view">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <rect x="1" y="1" width="6" height="6" rx="1"/>
              <rect x="9" y="1" width="6" height="6" rx="1"/>
              <rect x="1" y="9" width="6" height="6" rx="1"/>
              <rect x="9" y="9" width="6" height="6" rx="1"/>
            </svg>
          </button>
          <button class="history-view-btn" id="view-list" title="List view">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="1" y1="4"  x2="15" y2="4"/>
              <line x1="1" y1="8"  x2="15" y2="8"/>
              <line x1="1" y1="12" x2="15" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="history-content" id="history-content"></div>

  </div>

  <footer>
    <div class="footer-logo">EGE <span>NBA</span> Simulation</div>
    <p class="footer-copy">© 2025 EGE Simulation · All data fictional</p>
    <ul class="footer-links">
      <li><a href="players.html">Players</a></li>
      <li><a href="teams.html">Teams</a></li>
      <li><a href="other.html">Other</a></li>
    </ul>
  </footer>

  <script src="logos/teaminfo.js"></script>
  <script>if(window.EGE_SIM&&window.EGE_SIM.id==='sim-26'){document.write('<scr'+('ipt src="logos/teaminfo26.js"><\/scr')+('ipt>'));}</script>
  <script src="shared.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
